name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Visszaváltunk JDK 17-re, mert az Android Gradle Plugin 8.x ehhez van optimalizálva
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kényszerítjük a 8.10.2-es verziót, ami stabil az Androidhoz
          gradle-version: 8.10.2

      - name: Build APK
        # Hozzáadtuk a --stacktrace-t, hogy ha mégis elbukna, pontosan lássuk miért
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-keeper-final
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

