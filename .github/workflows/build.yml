name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Kiiktatunk minden automatikus Java-beállítást globálisan
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_TOOL_OPTIONS: ""
  _JAVA_OPTIONS: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Itt a titok: a parancs ELŐTT töröljük le a környezetet és kényszerítjük a tiszta futást
        run: |
          env -i HOME="$HOME" PATH="$PATH" ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"
