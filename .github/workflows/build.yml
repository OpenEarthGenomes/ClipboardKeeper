name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Globális környezeti változók - Ez minden lépésre érvényes lesz
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Itt kényszerítjük a 2GB memóriát az egész folyamatra, így elkerüljük a 64MB-os hibát
  _JAVA_OPTIONS: "-Xmx2048m -Xms512m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Most már csak a tiszta parancsot futtatjuk, a fenti 'env' vigyáz a memóriára
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-keeper-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
