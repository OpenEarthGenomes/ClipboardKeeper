name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Globálisan kiöljük a hibás változókat
  JAVA_TOOL_OPTIONS: ""
  _JAVA_OPTIONS: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Kényszerítjük a tiszta környezetet és manuálisan átadjuk a Java utat
        run: |
          export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.10-7/x64
          export PATH=$JAVA_HOME/bin:$PATH
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"
