name: Build APK (No ProGuard)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        # Itt kivettük a working-directory-t, mert a gyökérben vagyunk
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-keeper-final
          # Itt is javítottuk az elérési utat a valósághoz
          path: app/build/outputs/apk/debug/*.apk
