name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # A trükk: törlünk minden környezeti változót, ami bekavarhat, 
        # és a Gradle-nek belsőleg adjuk át a memóriát, megkerülve a rendszerszintű Java hívást.
        run: |
          export JAVA_TOOL_OPTIONS=""
          export _JAVA_OPTIONS=""
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-keeper-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
