name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # KIKAPCSOLJUK a cache-t, mert néha a cache hordozza a hibás configot
          # cache: gradle 

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # A megoldás: kitakarítjuk a változókat, és a parancs ELÉ írjuk a memóriát
        # és NEM használunk idézőjelet a paraméterek körül a futtatásnál
        run: |
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          export JAVA_OPTS="-Xmx2048m -Xms512m"
          ./gradlew assembleDebug --no-daemon
