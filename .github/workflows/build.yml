name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # A drasztikus megoldás: a parancs elé írt 'env -i' teljesen tiszta lapot indít.
        # Csak a legszükségesebb utat (PATH) hagyjuk meg, minden mást (a hibás Java opciókat is) törlünk.
        run: |
          env -i PATH="$PATH" HOME="$HOME" JAVA_HOME="$JAVA_HOME" ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"
