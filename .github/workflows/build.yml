name: Build APK (No ProGuard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Kényszerítjük a Node 24-et a figyelmeztetések ellen
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Ez az action automatikusan telepít egy JÓ Gradle-t, 
      # függetlenül attól, hogy a te gradlew fájlod rossz-e
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        # FIGYELEM: Itt nincs ott a ./ pont, simán a 'gradle' parancsot hívjuk!
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-keeper-final
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
